name: Temporary Host-Ship REALITY Registry Runtime Test

on:
  push:
    branches: [register-hostship-reality]
    paths:
      - "hostship-backend.js"
      - "hostship-bootstrap.js"
      - ".github/workflows/temp-hostship-runtime-ci.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Syntax and self-tests
        run: |
          node --check index.js
          node --check hostship-bootstrap.js
          node --check hostship-backend.js
          node --check hostship-cloudflare.js
          node --check hostship-mux.js
          node --check hostship-reality.js
          node --check hostship-tls.js
          HOSTSHIP_SELF_TEST=1 node hostship-backend.js
          node hostship-selftest.js
          node - <<'NODE'
          const fs=require('node:fs');
          const boot=fs.readFileSync('hostship-bootstrap.js','utf8');
          const back=fs.readFileSync('hostship-backend.js','utf8');
          for(const s of [
            "REGISTRY_DIRECT_ENDPOINT: 'http://' + PUBLIC_HOST + ':' + PUBLIC_PORT",
            "REGISTRY_NODE_URI: cfConfigured ? cfUri : ''",
            "REGISTRY_ENDPOINT: cfConfigured ? 'https://' + CF_TUNNEL_HOSTNAME : ''"
          ]) if(!boot.includes(s)) throw new Error('bootstrap missing '+s);
          for(const s of [
            "function publicRegistryPayloadForUri",
            "async function registerAdditionalNodes",
            "await registerAdditionalNodes({ quiet: true })",
            "registry_additional_registered: registryAdditionalRegistered",
            "route=reality"
          ]) if(!back.includes(s)) throw new Error('backend missing '+s);
          console.log('HOSTSHIP_REALITY_PUBLIC_PROOF_RUNTIME_OK');
          NODE
