name: Validate Host-Ship Node

on:
  push:
    branches: [main]
    paths:
      - "index.js"
      - "index.ts"
      - "hostship-bootstrap.js"
      - "hostship-mux.js"
      - "hostship-reality.js"
      - ".github/workflows/validate.yml"
  pull_request:
    branches: [main]
    paths:
      - "index.js"
      - "index.ts"
      - ".github/workflows/validate.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Syntax check
        run: |
          node --check index.js
          node --check hostship-bootstrap.js
          node --check hostship-mux.js
          node --check hostship-reality.js
      - name: Protocol self-test
        env:
          HOSTSHIP_SELF_TEST: "1"
          STATE_DIR: /tmp/hostship-self-test
        run: node index.js
