name: Validate CF Standby

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/validate-cf.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Syntax and CF standby tests
        run: |
          node --check index.js
          node --check hostship-backend.js
          node --check hostship-bootstrap.js
          node --check hostship-cloudflare.js
          node --check hostship-mux.js
          node --check hostship-reality.js
          node --check hostship-tls.js
          node - <<'NODE'
          const { cfWsUri, normalizeHostname, startCloudflareTunnel } = require('./hostship-cloudflare.js');
          const uri = cfWsUri({
            uuid:'1f7672c8-d15a-4174-a244-3a3e42b6e35b',
            wsPath:'/ws-test',
            hostname:'cf-test.example.com',
            label:'DE-HostShip-01-CF-Tunnel'
          });
          if (!uri.includes('security=tls') || !uri.includes('type=ws') || !uri.includes('@cf-test.example.com:443')) {
            throw new Error('CF URI format invalid');
          }
          if (normalizeHostname('https://cf-test.example.com/') !== 'cf-test.example.com') {
            throw new Error('hostname normalization failed');
          }
          startCloudflareTunnel({token:'',hostname:''}).then(result => {
            if (result !== null) throw new Error('standby must not start a child');
            console.log('CF_STANDBY_SELFTEST_OK origin_port=18080 uri_tls_ws=yes');
          }).catch(err => { console.error(err); process.exit(1); });
          NODE
