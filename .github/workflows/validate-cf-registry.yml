name: Validate Host-Ship CF Registry Routing

on:
  push:
    branches: [main, hostship-rust-direct-benchmark]
    paths:
      - "hostship-bootstrap.js"
      - "hostship-reality.js"
      - "hostship-backend.js"
      - "hostship-cloudflare.js"
      - ".github/workflows/validate-cf-registry.yml"
  pull_request:
    branches: [main]
    paths:
      - "hostship-bootstrap.js"
      - "hostship-reality.js"
      - "hostship-backend.js"
      - "hostship-cloudflare.js"
      - "hostship-selftest.js"
      - ".github/workflows/validate-cf-registry.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Syntax and runtime self-tests
        run: |
          node --check index.js
          node --check hostship-bootstrap.js
          node --check hostship-backend.js
          node --check hostship-cloudflare.js
          node --check hostship-mux.js
          node --check hostship-reality.js
          node --check hostship-tls.js
          HOSTSHIP_SELF_TEST=1 node hostship-backend.js
          node hostship-selftest.js
          node - <<'NODE'
          const fs=require('node:fs');
          const boot=fs.readFileSync('hostship-bootstrap.js','utf8');
          const back=fs.readFileSync('hostship-backend.js','utf8');
          const reality=fs.readFileSync('hostship-reality.js','utf8');
          for(const s of [
            "const directMode = /^(1|true|yes|on)$/i.test(String(process.env.HOSTSHIP_REALITY_DIRECT || '1').trim())",
            "const realityPort = directMode ? PUBLIC_PORT : await reservePort(excluded)",
            "if (mux) await mux.start()",
            "const expectedSubscriptionNodes = directUris.length + 1",
            "REGISTRY_ENABLED: '0'",
            "REGISTRY_NODE_URI: cfConfigured ? cfUri : ''",
            "REGISTRY_ENDPOINT: cfConfigured ? 'https://' + CF_TUNNEL_HOSTNAME : ''",
            "REGISTRY_DIRECT_ENDPOINT: directMode && CF_TUNNEL_HOSTNAME ? 'https://' + CF_TUNNEL_HOSTNAME : 'http://' + PUBLIC_HOST + ':' + PUBLIC_PORT",
            "PUBLIC_HOST: CF_TUNNEL_HOSTNAME",
            "PUBLIC_PORT: '443'",
            "PUBLIC_TLS: '1'",
            "PUBLIC_WS_HOST: CF_TUNNEL_HOSTNAME",
            "HOSTSHIP_REALITY_DIRECT: directMode ? '1' : '0'",
            "listenHost: directMode ? '0.0.0.0' : '127.0.0.1'",
            "Number(edgeAfterPublish.health?.subscription_nodes) === expectedSubscriptionNodes",
            "CF_TUNNEL_NODE_ACTIVE",
            "waitForEdgeHealth(CF_TUNNEL_HOSTNAME"
          ]) if(!boot.includes(s)) throw new Error('bootstrap missing '+s);
          for(const s of [
            "function applyProfile(config, backendPort, listenHost = '127.0.0.1')",
            "config.inbounds[0].listen = { mode: 'ipv4Only', ipv4: listenHost }"
          ]) if(!reality.includes(s)) throw new Error('reality module missing '+s);
          for(const s of [
            "registryNodeUri = String(process.env.REGISTRY_NODE_URI || '').trim()",
            "REGISTRY_SKIPPED reason=cf_tls_ws_node_not_configured",
            "registryRegistered",
            "registryLastError",
            "registryPermanentFailure",
            "registryAdditionalRegistered",
            "registerAdditionalNodes({ quiet: true })",
            "route=reality",
            "if (registryForcePublicProof)"
          ]) if(!back.includes(s)) throw new Error('backend missing '+s);
          const cf=require('./hostship-cloudflare.js');
          for (const name of ['startCloudflareTunnel','waitForEdgeHealth','stopCloudflareTunnel','cfWsUri','normalizeHostname']) {
            if (typeof cf[name] !== 'function') throw new Error('Cloudflare module export missing '+name);
          }
          const uri=cf.cfWsUri({
            uuid:'1f7672c8-d15a-4174-a244-3a3e42b6e35b',
            wsPath:'/ws-test',
            hostname:'host-ship-01.pp1.de5.net',
            label:'CF-Test'
          });
          const parsed=new URL(uri);
          if(parsed.hostname!=='host-ship-01.pp1.de5.net' || parsed.port!=='443' ||
             parsed.searchParams.get('security')!=='tls' ||
             parsed.searchParams.get('type')!=='ws' ||
             parsed.searchParams.has('pcs') || parsed.searchParams.has('vcn')) {
            throw new Error('CF VLESS URI is not clean standard TLS/WS');
          }
          console.log('CF_REGISTRY_ROUTING_POLICY_OK uri=tls-ws-standard');
          NODE
